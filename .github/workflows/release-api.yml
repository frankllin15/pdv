name: Release API

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "informational=$TAG+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore PDV.sln

      - name: Build
        run: >
          dotnet build PDV.sln -c Release --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:InformationalVersion=${{ steps.version.outputs.informational }}

      - name: Test
        run: dotnet test Tests/PDV.Tests/PDV.Tests.csproj -c Release --no-build

      - name: Publish API
        run: >
          dotnet publish Presentation/PDV.API/PDV.API.csproj
          -c Release
          --no-build
          -o publish/api

      - name: Upload API artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-publish
          path: publish/api/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Presentation/PDV.API/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pdv-api:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/pdv-api:latest
